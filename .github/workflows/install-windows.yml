name: Windows installer rehearsal

# install.ps1 on a fresh Windows runner, the way a person runs it: Windows PowerShell 5.1, the
# piped `irm | iex` form and the script form with options, against the wheel this tree builds.
# uv installed by its own installer when the image has none, `cadgen install` run with nothing
# asked, the `cadgen` command registered, the doctor's verdict, a second run and the uninstall.
# A rehearsal, not a release gate: dispatched by hand, or by a push to the release branch that
# changes the installer or what it runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref to rehearse (default: the branch dispatched)"
        required: false
        default: ""
  push:
    branches: [codex/python-engine-clients]
    paths:
      - .github/workflows/install-windows.yml
      - scripts/install/install.ps1
      - packages/cadgen/src/cadgen/cli/install.py
      - packages/cadgen/src/cadgen/cli/doctor.py
      - packages/cadgen/src/cadgen/_internal/providers.py
      - packages/cadgen/src/cadgen/_internal/launch.py

permissions:
  contents: read

jobs:
  wheel:
    name: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web apps/mcp
          playwright: "false"

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Build and check the wheel
        env:
          CADGEN_KEEP_WHEEL: "1"
          CADGEN_WHEEL_OUT_DIR: ${{ runner.temp }}/cadgen-wheel
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      - name: Keep the wheel for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: cadgen-wheel
          path: ${{ runner.temp }}/cadgen-wheel/*.whl
          if-no-files-found: error
          retention-days: 1

  windows:
    name: install.ps1 (Windows PowerShell 5.1)
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_NO_MODIFY_PATH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Take the wheel
        uses: actions/download-artifact@v8
        with:
          name: cadgen-wheel
          path: ${{ runner.temp }}\wheel

      - name: The wheel to install from, and the release it is
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP\wheel\*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "no wheel in $env:RUNNER_TEMP\wheel" }
          $release = (Get-Content VERSION -Raw).Trim()
          "CADGEN_WHEEL=$wheel" >> $env:GITHUB_ENV
          "CADGEN_RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "wheel: $wheel"
          Write-Host "release: $release"
          if (Get-Command uv -ErrorAction SilentlyContinue) {
            Write-Host "uv is on this image already: the bootstrap's own install of uv is not exercised here"
          } else {
            Write-Host "no uv on this image: the bootstrap installs it with uv's installer"
          }

      - name: Usage, under PowerShell 7
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install\install.ps1 --help
          pwsh -NoProfile -File scripts\install\install.ps1 --help

      # cmd redirects the streams, so Windows PowerShell 5.1 sees a console as a person does: no
      # stderr line of uv's becomes a PowerShell error record.
      - name: Dry run, as a script with options (5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install\install.ps1 --from "%CADGEN_WHEEL%" --dry-run > "%RUNNER_TEMP%\dry-run.txt" 2>&1

      - name: The dry run's plan
        shell: pwsh
        run: |
          $out = Get-Content "$env:RUNNER_TEMP\dry-run.txt" -Raw
          Write-Host $out
          if ($out -match 'cadgen install exited') { throw "cadgen install failed" }
          if ($out -notmatch "text-to-cad $([regex]::Escape($env:CADGEN_RELEASE)) for this machine") { throw "the plan does not name the release" }
          if ($out -notmatch 'Dry run: nothing was changed\.') { throw "the dry run did not end as one" }
          $cmd = Join-Path $env:USERPROFILE '.local\bin\cadgen.cmd'
          if (Test-Path $cmd) { throw "a dry run wrote $cmd" }

      - name: Install, piped as the docs say (irm | iex, 5.1)
        shell: cmd
        env:
          CADGEN_INSTALL_FROM: ${{ env.CADGEN_WHEEL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw scripts\install\install.ps1 | Invoke-Expression" > "%RUNNER_TEMP%\install.txt" 2>&1

      - name: What the install did
        shell: pwsh
        run: |
          $out = Get-Content "$env:RUNNER_TEMP\install.txt" -Raw
          Write-Host $out
          if ($out -match 'cadgen install exited') { throw "cadgen install failed" }
          if ($out -notmatch "cadgen\s+registered $([regex]::Escape($env:CADGEN_RELEASE))") { throw "cadgen did not register" }
          $cmd = Join-Path $env:USERPROFILE '.local\bin\cadgen.cmd'
          if (-not (Test-Path $cmd)) { throw "the cadgen command was not written at $cmd" }
          "CADGEN_CMD=$cmd" >> $env:GITHUB_ENV

      - name: The registered command, the doctor, a second run, the uninstall
        shell: pwsh
        run: |
          & $env:CADGEN_CMD --version
          if ($LASTEXITCODE) { throw "cadgen --version exited $LASTEXITCODE" }
          & $env:CADGEN_CMD doctor
          if ($LASTEXITCODE) { throw "cadgen doctor exited $LASTEXITCODE" }
          & $env:CADGEN_CMD install --dry-run
          if ($LASTEXITCODE) { throw "a second cadgen install --dry-run exited $LASTEXITCODE" }
          & $env:CADGEN_CMD install --uninstall
          if ($LASTEXITCODE) { throw "cadgen install --uninstall exited $LASTEXITCODE" }
